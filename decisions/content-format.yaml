# What content, if any, a merged change deserves. State given to the model: the project's audience,
# the change brief, PR facts (labels, size, description and diff, both fenced), the held queue and
# today's posting count, the release bump level and the owner's latest choices as precedents.
questions:
  format:
    type: choice
    instructions: >-
      Choose how much content this change deserves for the audience described in `audience`. Work it
      out in this order. First, who notices the change: changes only maintainers, contributors or people
      who host or operate the project notice (admin endpoints, deploy settings, internal APIs, CI)
      count as internal unless the audience includes those people. Second, count the headline changes:
      things the audience can now do, or must now do differently. A refactor, small fixes and tweaks
      that support a headline change are part of it, not more headlines, so count the brief's items
      by what they mean to the audience, not one by one. Third, pick the format from that count.
      Judge by the diff and the brief together; where they disagree, trust the diff. A version number
      alone doesn't call for a thread: the release notes are published separately. When the PR is a
      release, `release.bump` is the maintainer's own estimate of its size: a major or minor bump
      (in a 0.x project, a minor bump is the big one) suggests a headline change, a patch bump suggests
      fixes. Weigh it as a hint, not a rule. `owner_precedents` are the owner's latest choices for
      other changes, with what the model had chosen: where a similar change got a different format
      than the model's, follow the owner's taste.
    criteria:
      skip: >-
        The audience notices nothing: internal work, tests, CI, docs typos, dependency bumps, or
        changes only operators, maintainers or self-hosters notice when they aren't the audience.
      hold: >-
        The audience notices it, but it's minor: a small fix or improvement that isn't worth a post
        alone. It goes in the next digest.
      post: >-
        One headline change for the audience, told as one message: a post, continued in a reply or
        two when it needs the room. Also when the PR carries supporting fixes, a refactor or a
        version bump.
      thread: >-
        Two or more independent headline changes for the audience, or one that needs several steps
        to explain or to adopt (a breaking change that makes the audience do something to upgrade).
  merge_with_held:
    type: boolean
    instructions: The change is closely related to at least one item in the held queue and they read better together.
  link_worth_cost:
    type: boolean
    instructions: >-
      Readers need a link to a specific page (an install guide, a docs page, the release notes) to
      act on this content. A post with a link costs about 13 times more than one without. A link to
      the repo or the project's homepage alone is never worth it: followers find those in the profile.
