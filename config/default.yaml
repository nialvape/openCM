# Harness defaults. A project overrides any key in projects/<id>/project.yaml under `harness:`.
# Behavior lives here, not in prompt prose: models, tool allowlists and budgets are enforced in code.

# Every role also takes maxOutputTokens (default 4000) and stepTimeoutSec (default 180): caps per model call,
# so a runaway generation stops early instead of running for minutes and costing dollars. And reasoning
# (none | minimal | low | medium | high; default: the provider's) for how much the model may think.
# Model ids are "<provider>:<model>". Providers: gateway (Vercel AI Gateway, VERCEL_AI_GATEWAY_API_KEY; ids
# "<vendor>/<model>" from https://ai-gateway.vercel.sh/v1/models), openrouter (ids from https://openrouter.ai/models),
# anthropic, openai, google (direct APIs).
# The critic uses a different model family than the writer on purpose (same-family judges favor their own output).
roles:
  analyst:
    model: gateway:zai/glm-5.3
    tools: [repo_list, repo_read_file, repo_diff, repo_search, get_pr, load_skill]
    maxSteps: 10
    maxCostUsd: 0.20
    plan: false
    reasoning: low
  writer:
    model: gateway:zai/glm-5.3
    tools: [load_skill, measure_posts]
    maxSteps: 10
    maxCostUsd: 0.20
    plan: false
    maxOutputTokens: 3000
    reasoning: low
  critic:
    model: gateway:anthropic/claude-sonnet-5.5
    tools: []
    maxSteps: 1
    maxCostUsd: 0.10
    plan: false
    maxOutputTokens: 2000
    reasoning: low
  chat:
    model: gateway:zai/glm-5.3-flash
    tools: [repo_list, repo_read_file, repo_search, get_pr, list_prs, load_skill, send_message, draft_for_pr]
    maxSteps: 15
    maxCostUsd: 0.30
    plan: false
  compactor:
    model: gateway:zai/glm-5.3-flash
    tools: []
    maxSteps: 1
    maxCostUsd: 0.05
    plan: false
  # Proposes lessons from the owner's edits and rejections; the reviewer (another model family) checks them.
  reflect:
    model: gateway:zai/glm-5.3
    tools: []
    maxSteps: 1
    maxCostUsd: 0.10
    plan: false
    maxOutputTokens: 3000
  reviewer:
    model: gateway:anthropic/claude-sonnet-5.5
    tools: []
    maxSteps: 1
    maxCostUsd: 0.10
    plan: false
    maxOutputTokens: 2000
    reasoning: low

# Largest tool result (in characters) put in context; longer outputs are cut with a note on how to page.
maxToolOutputChars: 12000

# USD per million tokens, for cost metering and budgets. OpenRouter reports the real cost of each call; the
# gateway records it asynchronously, so its models are priced here. Source: https://ai-gateway.vercel.sh/v1/models
# (read 2026-10-25; some models vary slightly by upstream provider). Without a price, only the step budget applies.
pricing:
  gateway:zai/glm-5.3: { input: 1.2, output: 4.0, cacheRead: 0.2 }
  gateway:zai/glm-5.3-flash: { input: 0.15, output: 0.5, cacheRead: 0.03 }
  gateway:anthropic/claude-sonnet-5.5: { input: 2.0, output: 10.0, cacheRead: 0.1 }

# Decision models answer typed questions with a probability per option instead of generating text.
# They're served through OpenRouter's Decisions API (e.g. cloudflare/clef, cloudflare/clef-flash,
# typesafe/jev-1.14). Schemas (the questions) live in decisions/<name>.yaml; a project can replace
# one in projects/<id>/decisions/<name>.yaml.
decisions:
  model: gateway:baseten/mammoth-1
  # An answer is used only when its probability reaches the threshold; below it the owner decides.
  # Start strict; refit per question from the owner's labeled choices (opencm fit-thresholds, phase 3).
  thresholds:
    default: 0.85
  # The owner's latest format choices (accepted or changed) go in the state as precedent.
  historySize: 10

# Telegram chat sessions. When a session's history grows past compactAtChars, the older part is
# summarized by the compactor role and only the last keepRecentTurns of the owner's turns stay verbatim.
chat:
  compactAtChars: 60000
  keepRecentTurns: 6

# Publishing to X. Prices are the X API pay-per-use list (docs.x.com, checked 2026-10-22): a post with a
# link costs about 13x a plain one. DRY_RUN=1 in .env (the default) logs instead of posting.
x:
  prices: { post: 0.015, postWithLink: 0.2, read: 0.005 }
  maxSpendPerDayUsd: 1.0
  metricsAfterHours: [24, 168]

# What the agent learns. Approved posts become examples for the writer; each draft records which
# examples it used, and approvals, edits, rejections and engagement credit them. The lowest-scored
# are evicted past maxExamples. Lessons come from the reflect job and need the owner's approval.
memory:
  examplesPerDraft: 3
  maxExamples: 30
  reflectAfter: 3
